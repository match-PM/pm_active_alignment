# Startup defaults; compact YAML with the same sections is also accepted.
active_alignment_server:
  ros__parameters:
    # Shared by every optimizer. Times are seconds; joint tolerance uses physical units.
    general:
      max_evaluations: 80
      movement_time: 0.1
      # Optional settling, followed by a fresh sample from EVERY objective topic.
      wait_for_settle: 0.0
      measurement_timeout: 5.0
      trajectory_timeout: 20.0
      joint_tolerance: 1.0e-06
      metrics_topic_prefix: ''
      random_seed: 0
      # Optional early stopping: stop when the weighted objective <= this threshold.
      # Leave disabled when the useful measurement range is unknown.
      stop_on_objective_threshold: false
      objective_threshold: 0.0  # Maximization topics enter the objective with a minus sign.
    hill_climb:
      step_size: 0.1
      adaptive_step: false
      step_increase_factor: 1.2
      step_decrease_factor: 0.5
      min_step: 0.001
      max_step: 0.3
      adaptation_window: 6
    hill_climb_manual:
      step_size: 0.1
      adaptive_step: false
      step_increase_factor: 1.2
      step_decrease_factor: 0.5
      min_step: 0.001
      max_step: 0.3
      coordinate_wise: true
    adaptive_hill_climb:
      step_size: 0.1
      adaptive_step: true
      step_increase_factor: 1.3
      step_decrease_factor: 0.3
      min_step: 0.001
      max_step: 0.5
      coordinate_wise: true
    nelder_mead:
      max_iterations: 200
      xatol: 1.0e-05
      fatol: 1.0e-05
      simplex_step: 0.05
      adaptive: false
    nelder_mead_manual:
      max_iterations: 200
      xatol: 1.0e-05
      fatol: 1.0e-05
      simplex_step: 0.05
      alpha: 1.0
      beta: 2.0
      gamma: 0.5
      delta: 0.5
    pybobyqa:
      initial_tr_radius: 0.1
      final_tr_radius: 1.0e-05
      npt: 0
      # Seeded random interpolation directions avoid symmetric geometry on narrow peaks.
      random_initial_directions: true
      noise_aware: true
      use_restarts: true
      quit_on_noise_level: false
    random_search:
      use_global_search: true
      perturbation_scale: 0.3
    simple_adaptive_random_search:
      sigma: 0.25
      alpha: 1.1
      gamma: 0.9
      min_sigma: 0.01
      max_sigma: 1.0
      window_size: 10
